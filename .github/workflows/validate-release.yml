name: validate-release

on:
  push:
    branches: [master, main]
    paths:
      - 'release_package/**'
      - 'ontology/tdoc-ontology.ttl'
      - 'scripts/paper/**'
      - '.github/workflows/validate-release.yml'
  pull_request:
    paths:
      - 'release_package/**'
      - 'ontology/tdoc-ontology.ttl'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: |
          pip install --quiet "rdflib>=6.0,<8" "pyshacl>=0.20" "pylode<3"

      - name: Parse ontology TTL (rdflib)
        run: |
          python3 -c "
          import rdflib
          g = rdflib.Graph()
          g.parse('release_package/ontology/spectra.ttl', format='turtle')
          print(f'release TTL triples: {len(g)}')
          assert len(g) > 800, 'Suspiciously low triple count'
          "

      - name: Parse SHACL shapes
        run: |
          python3 -c "
          import rdflib
          g = rdflib.Graph()
          g.parse('release_package/shapes/spectra-core.shacl.ttl', format='turtle')
          print(f'SHACL triples: {len(g)}')
          "

      - name: Validate snippet against SHACL shapes
        run: |
          pyshacl -s release_package/shapes/spectra-core.shacl.ttl \
                  release_package/examples/instantiation_snippet.ttl

      - name: Validate SPARQL syntax
        run: |
          python3 -c "
          from rdflib.plugins.sparql import prepareQuery
          import glob, sys
          fail = 0
          for f in sorted(glob.glob('release_package/queries/sparql/*.rq')):
              try:
                  prepareQuery(open(f).read())
                  print(f'OK   {f}')
              except Exception as e:
                  print(f'FAIL {f}: {e}')
                  fail += 1
          sys.exit(fail)
          "

      - name: Verify revised Core contract bundle
        working-directory: release_package/cqs/canonical_core
        run: |
          python3 -B verify_release.py
          python3 -B -m unittest test_scorer test_cli

      - name: Verify original-question repair bundle
        working-directory: release_package/cqs/original_core_repair
        run: |
          python3 -B -S verify_release.py
          python3 -B -S -m unittest test_scorer test_native_order test_predictions test_boundary_ties

      - name: Verify retained original-question evaluation
        timeout-minutes: 20
        run: |
          python3 -B -S release_package/cqs/original_core_evaluation/runtime/verify_evidence.py \
            --evidence release_package/cqs/original_core_evaluation \
            --bundle release_package/cqs/original_core_repair \
            --out /tmp/spectra-evaluation-verification.json

      - name: Verify additional original-question repairs and predictions
        run: |
          python3 -B -S release_package/cqs/original_core_additional_evaluation/runtime/verify_additional_evaluation.py \
            --evidence release_package/cqs/original_core_additional_evaluation \
            --bundle release_package/cqs/original_core_additions \
            --parent release_package/cqs/original_core_repair \
            --out /tmp/spectra-additional-verification.json

      - name: Predicate consistency audit (if script available)
        run: |
          if [ -f scripts/paper/audit_predicate_consistency.py ]; then
            python3 scripts/paper/audit_predicate_consistency.py | tail -10
          else
            echo "Audit script not in repo (kept private)."
          fi

      - name: Verify current original Core index
        run: python3 -B -S release_package/cqs/current_core/verify_index.py
      - name: Verify complete SQL interface evidence
        run: python3 -B -S release_package/cqs/original_core_sql_interface_evaluation/verify_archive.py
      - name: Verify saved source-access evidence
        run: python3 -B -S release_package/cqs/source_access_diagnostic/verify_saved.py
      - name: Verify top-k replacements
        run: >-
          python3 -B -S release_package/cqs/original_core_topk_replacements/verify_replacements.py
          --bundle release_package/cqs/original_core_topk_replacements
          --parent release_package/cqs/original_core_repair
          --out /tmp/spectra-topk-replacements.json
      - name: Replay later original-question cohorts
        run: |
          for cohort in followup source natural final; do
            python3 -B -S release_package/cqs/original_core_${cohort}_evaluation/runtime/verify_additional_evaluation.py \
              --evidence release_package/cqs/original_core_${cohort}_evaluation \
              --bundle release_package/cqs/original_core_${cohort}_repairs \
              --parent release_package/cqs/original_core_repair \
              --out /tmp/spectra-${cohort}-verification.json
          done
      - name: Replay current top-k contract evaluation
        run: >-
          python3 -B -S release_package/cqs/original_core_topk_evaluation/runtime/verify_topk_evaluation.py
          --evidence release_package/cqs/original_core_topk_evaluation
          --bundle release_package/cqs/original_core_topk_replacements
          --parent release_package/cqs/original_core_repair
          --out /tmp/spectra-current-topk-evaluation.json
      - name: Verify explicit named Agreement repair
        working-directory: release_package/cqs/original_core_named_agreement_repairs
        run: python3 -B -S verify_additions.py
      - name: Replay explicit named Agreement evaluation
        run: >-
          python3 -B -S release_package/cqs/original_core_named_agreement_evaluation/runtime/verify_additional_evaluation.py
          --evidence release_package/cqs/original_core_named_agreement_evaluation
          --bundle release_package/cqs/original_core_named_agreement_repairs
          --parent release_package/cqs/original_core_repair
          --out /tmp/spectra-named-agreement-evaluation.json
      - name: Verify resolution-to-CR-to-spec ranking repair
        run: >-
          python3 -B -S release_package/cqs/original_core_path_top5_repairs/verify_path_top5_bundle.py
          --bundle release_package/cqs/original_core_path_top5_repairs
          --parent release_package/cqs/original_core_repair
      - name: Replay resolution-to-CR-to-spec ranking evaluation
        run: >-
          python3 -B -S release_package/cqs/original_core_RAN3_path_evaluation/runtime/verify_path_top5_evaluation.py
          --evidence release_package/cqs/original_core_RAN3_path_evaluation
          --bundle release_package/cqs/original_core_path_top5_repairs
          --parent release_package/cqs/original_core_repair
          --out /tmp/spectra-path-top5-evaluation.json
